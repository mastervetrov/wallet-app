services:
  wallet:
    container_name: wallet
    ports:
      - "8080:8080"
    image: rumyancevivan/wallet:latest
    env_file:
      - .env.prod
  postgres:
    container_name: postgres-wallet
    ports:
      - "5432:5432"
    image: postgres:17.5
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

volumes:
  postgres_data: